<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Invoices{% endblock %} &middot; {{ settings.company_name }}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='app.css') }}">
  <style>:root { --accent: {{ settings.accent_color }}; }</style>
</head>
<body>
  <header class="topbar">
    <div class="wrap">
      <a class="brand" href="{{ url_for('index') }}">{{ settings.company_name }}</a>
      <nav>
        <a href="{{ url_for('index') }}">Invoices</a>
        <a href="{{ url_for('clients') }}">Clients</a>
        <a href="{{ url_for('settings_page') }}">Settings</a>
      </nav>
      <a class="btn primary" href="{{ url_for('new_invoice') }}">New invoice</a>
    </div>
  </header>

  <main class="wrap">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash {{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}
    {% block content %}{% endblock %}
  </main>

  {% block scripts %}{% endblock %}
</body>
</html>
